services:
  postgres:
    image: postgres:18.6
    container_name: hospoda-postgres
    environment:
      POSTGRES_DB: application
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - hospoda-data:/var/lib/postgresql/data
    networks:
      - hospoda-network
  
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev
    container_name: hospoda-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://hospoda-postgres:5432/keycloak
      KC_DB_USERNAME: user
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - hospoda-network

volumes:
  hospoda-data:

networks:
  hospoda-network:
    driver: bridge
